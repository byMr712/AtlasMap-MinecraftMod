plugins {
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "mapminecraft" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = "mapminecraft-test"
        enableGameTests = false
        enableClientGameTests = true
        eula = true
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API is only used by the optional Fabric client gametests, never by the mod itself.
    gametestImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release.set(targetJavaVersion)
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
}

// ---------------------------------------------------------------------------
// NeoForge dual-target build: one source tree, two loaders.
// The Fabric entrypoint is excluded from the NeoForge JAR and the NeoForge
// stubs are excluded as well, so the same compiled classes run on both loaders.
// ---------------------------------------------------------------------------
sourceSets {
    neoforge {
        java {
            srcDirs = ['src/neoforge/java']
        }
        resources {
            srcDirs = ['src/neoforge/resources']
        }
        compileClasspath += sourceSets.main.output + sourceSets.client.output + configurations.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.client.output + configurations.runtimeClasspath
    }
}

processNeoforgeResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version

    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": project.version, "minecraft_version": project.minecraft_version
    }
}

def artifactVersion = "v${project.version}"

jar {
    archiveFileName = "${project.archives_base_name}-${artifactVersion}.jar"
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

tasks.matching { it.name == 'remapJar' }.configureEach {
    archiveFileName = "${project.archives_base_name}-${artifactVersion}.jar"
}

tasks.matching { it.name == 'sourcesJar' || it.name == 'remapSourcesJar' || it.name == 'javadocJar' }.configureEach {
    enabled = false
}

task jarNeoForge(type: Jar) {
    dependsOn compileNeoforgeJava, processNeoforgeResources, clientClasses, classes
    archiveFileName = "${project.archives_base_name.replace('-Fabric-', '-NeoForge-')}-${artifactVersion}.jar"
    destinationDirectory = layout.buildDirectory.dir("libs")
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from(sourceSets.main.output) {
        exclude "fabric.mod.json"
    }
    from(sourceSets.client.output) {
        // Fabric-only entrypoint; NeoForge uses MapminecraftNeoForge instead.
        exclude "org/webtrade/mapminecraft/client/MapminecraftClient.class"
    }
    from(sourceSets.neoforge.output) {
        // Compile-time stubs must never reach the runtime classpath.
        exclude "net/**"
    }
    from("src/client/resources/assets/mapminecraft/icon.png") {
        into ""
        rename { "icon.png" }
    }
    from("LICENSE")
}

build.dependsOn(jarNeoForge)
